[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "findmypipe"
version = "0.1.0"
description = "FindMyPipe: local CLI bridge for Apple Find My / Dov'e polling from Linux, designed for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Corrado + Agata" }]
maintainers = [{ name = "Corrado + Agata" }]
keywords = ["apple", "findmy", "icloud", "location", "privacy", "cli", "agent", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
urls = { Repository = "https://github.com/corryl/FindMyPipe", Issues = "https://github.com/corryl/FindMyPipe/issues" }
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
]
live = [
  "pyicloud>=1.0.0",
]

[project.scripts]
findmy-agent = "findmy_agent_bridge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/findmy_agent_bridge"]
